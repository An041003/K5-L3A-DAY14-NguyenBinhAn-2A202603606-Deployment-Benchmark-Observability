name: Day14 quality gate
on: [pull_request, workflow_dispatch]
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r 06-lab-complete/benchmark-observability/develop/requirements.txt
      - name: Check baseline and KB
        run: |
          test -f reports/eval_v2.json
          python scripts/fix_kb.py --check
      - name: Run golden quality gate
        working-directory: 06-lab-complete/benchmark-observability/develop
        env:
          AGENT_VERSION: v2
          MOCK_ERROR_RATE: '0'
          PORT: '8002'
        run: |
          python app.py > /tmp/day14-agent.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8002/health && break; sleep 1; done
          python eval/run_eval.py --url http://127.0.0.1:8002 --min-accuracy 1.0 --baseline ../../../reports/eval_v2.json --out /tmp/eval_ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            /tmp/eval_ci.json
            /tmp/day14-agent.log
